name: Build Windows portable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install pinned desktop dependencies
        run: npm ci --prefix desktop --registry https://registry.npmjs.org
      - name: Build portable executable
        run: npm run desktop:dist
      - name: Generate SHA-256
        shell: pwsh
        run: |
          Get-ChildItem ../ForgeRelay-App/ForgeRelay-*-Windows-x64.exe | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)" | Set-Content -LiteralPath ($_.FullName + '.sha256') -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeRelay-Windows-x64-portable
          path: |
            ../ForgeRelay-App/ForgeRelay-*-Windows-x64.exe
            ../ForgeRelay-App/ForgeRelay-*-Windows-x64.exe.sha256
