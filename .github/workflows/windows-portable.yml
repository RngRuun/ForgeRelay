name: Build Windows portable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned engine dependencies
        run: npm ci --registry https://registry.npmjs.org
      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: npm ci --registry https://registry.npmjs.org
      - name: Build portable executable
        run: npm run desktop:dist
      - name: Package overwrite upgrade and committed source
        shell: pwsh
        run: |
          $relayVersion = (Get-Content package.json | ConvertFrom-Json).version
          python tools/package-release.py --executable "../ForgeRelay-App/ForgeRelay-$relayVersion-Windows-x64.exe" --output ../ForgeRelay-Release
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeRelay-Windows-x64-portable
          path: |
            ../ForgeRelay-Release/*
