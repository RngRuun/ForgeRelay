name: Frontend and backend checks
on:
  push:
    branches: [main, bug-resolve]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned engine dependencies
        run: npm ci --registry https://registry.npmjs.org
      - name: Install browser integration test dependency
        run: npm install --no-save --package-lock=false --registry https://registry.npmjs.org playwright@1.62.1
      - name: Run deterministic checks without provider credentials
        shell: pwsh
        run: |
          $env:RELAY_PYTHON = (Get-Command python).Source
          $env:DEEPSEEK_API_KEY = ''
          npm test
